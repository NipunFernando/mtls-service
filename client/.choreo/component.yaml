# Choreo component descriptor for the companion mTLS client.
#
# Deploy as a Manual/Scheduled Task with CLIENT_MODE=once (it calls the server,
# prints /info and exits; a failed mTLS handshake exits non-zero and the run is
# marked failed), or as a Service with CLIENT_MODE=gate, where the health port
# below only starts answering once the mTLS call has succeeded -- which turns a
# broken mTLS setup into a failed deployment.
schemaVersion: 1.2

# Only needed in gate mode, where the probe target must be reachable.
# Comment the whole block out when deploying as a task.
#
# Two routes are served here:
#   GET /healthz      - the gate; 200 only once the mTLS call has succeeded
#   GET /diagnostics  - re-runs the mTLS call now and returns what the server saw
#
# /diagnostics is what makes the loop testable from Choreo's Test Console.  The
# server cannot be tested from there (it is a TCP passthrough endpoint and the
# console cannot present a client certificate), so the client stands in as the
# way in.
#
# Public so the Test Console can reach it.  That is acceptable here only because
# this is a test rig holding throwaway certificates and fake configuration:
# /diagnostics echoes the server's config back, and while secrets are masked the
# masking still discloses their length and last four characters.  Keep
# REVEAL_SECRETS false on the server -- with it on, a public caller could read
# the secrets outright.
endpoints:
  - name: client-api
    displayName: Client API
    service:
      basePath: /
      port: 8080
    type: REST
    # Without a schema the Test Console has no route list and falls back to "/",
    # which answers with the health body and makes it look as though
    # /diagnostics is not there.
    schemaFilePath: openapi.yaml
    networkVisibilities:
      - Public

configurations:
  env:
    - name: SERVER_HOST
      valueFrom:
        configForm:
          displayName: Server Host (Choreo service DNS name)
          type: string
          required: true
    - name: SERVER_PORT
      valueFrom:
        configForm:
          displayName: Server Port
          type: number
          required: false
    - name: SERVER_NAME
      valueFrom:
        configForm:
          displayName: Server Certificate Name to Verify (SNI)
          type: string
          required: false
    - name: CLIENT_CERT
      valueFrom:
        configForm:
          displayName: Client Certificate Mount Path
          type: string
          required: false
    - name: CLIENT_KEY
      valueFrom:
        configForm:
          displayName: Client Private Key Mount Path
          type: string
          required: false
    - name: SERVER_CA
      valueFrom:
        configForm:
          displayName: Server CA Mount Path
          type: string
          required: false
    - name: CLIENT_MODE
      valueFrom:
        configForm:
          displayName: Mode (once | gate)
          type: string
          required: false
    - name: CHECK_HOSTNAME
      valueFrom:
        configForm:
          displayName: Verify Server Hostname
          type: boolean
          required: false
    - name: RETRY_ATTEMPTS
      valueFrom:
        configForm:
          displayName: Retry Attempts
          type: number
          required: false
    - name: LOG_LEVEL
      valueFrom:
        configForm:
          displayName: Log Level
          type: string
          required: false
